name: Validate solutions

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solutions:
    name: ${{ matrix.lang }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lang: [python, java, javascript, csharp]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run ${{ matrix.lang }} solutions
        run: python tools/run_solutions.py ${{ matrix.lang }} --jobs 4

  index:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate specs, index and mapping
        run: |
          python tools/ctci_map.py
          python tools/gen_tasks.py
          python tools/gen_index.py

      - name: Fail when generated docs drift
        run: git diff --exit-code

  links:
    name: Tutorial links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python tools/check_links.py
